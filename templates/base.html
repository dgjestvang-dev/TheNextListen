<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sort your albums to keep track of what you want to check out next with The Next Listen.">
  <title>The Next Listen</title>
  <link rel="stylesheet" 
   href="{{url_for('static', filename='styles.css')}}">
  <link href="https://fonts.cdnfonts.com/css/inter" rel="stylesheet">
</head>


<body>

<!--Icon definitions-->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="search-icon" viewBox="0 0 24 24">
            <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

<header> The Next Listen</header>

<nav>
    <ul>
        <li {% if active_page == 'home' %}class="active"{% endif %}><a href="{{url_for('home')}}">Oppdag</a></li>
        <li {% if active_page == 'mymusic' %}class="active"{% endif %}><a href="{{url_for('mymusic')}}">Min musikk</a></li>
        <li {% if active_page == 'feed' %}class="active"{% endif %}><a href="{{url_for('feed')}}">Feed</a></li>
    </ul>
</nav>   
<main> 
{% block content %}
{% endblock %}

</main>
