<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sort your albums to keep track of what you want to check out next with The Next Listen.">
  <title>The Next Listen</title>
  <link rel="stylesheet" 
    href="{{url_for('static', filename='styles.css')}}">
  
    <link href="https://fonts.cdnfonts.com/css/inter" rel="stylesheet">
    
    <link href="https://fonts.cdnfonts.com/css/barlow" rel="stylesheet">

  <script 
    src="{{url_for('static', filename='index.js')}}" defer></script>
</head>


<body>

<!--Icon definitions-->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="search-icon" viewBox="0 0 24 24">
            <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#121212" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
        </symbol>

        <symbol id="plateko-icon" viewBox="0 0 32 32">
            <path d="M3 24V5a2 2 0 0 1 2-2h19"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round" />
            <path d="M8 8h21v21H8z M15 13v11l9-5.5z"
                fill="currentColor"
                fill-rule="evenodd" />
        </symbol>

        <symbol id="user-icon" viewBox="0 0 256 256">
            <path d="M228,128A100,100,0,1,0,60.71,201.90967a3.97048,3.97048,0,0,0,.842.751,99.79378,99.79378,0,0,0,132.8982-.00195,3.96558,3.96558,0,0,0,.83813-.74756A99.76267,99.76267,0,0,0,228,128ZM36,128a92,92,0,1,1,157.17139,64.87207,75.616,75.616,0,0,0-44.50782-34.04053,44,44,0,1,0-41.32714,0,75.61784,75.61784,0,0,0-44.50782,34.04A91.70755,91.70755,0,0,1,36,128Zm92,28a36,36,0,1,1,36-36A36.04061,36.04061,0,0,1,128,156ZM68.86475,198.417a68.01092,68.01092,0,0,1,118.27.00049,91.80393,91.80393,0,0,1-118.27-.00049Z"/>
        </symbol>

        <symbol id="checking-out-now-icon" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.75"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
                <rect x="4" y="13" width="4" height="7" rx="2" />
                <rect x="16" y="13" width="4" height="7" rx="2" />
            </g>
        </symbol>

        <symbol id="will-check-out-icon" viewBox="0 0 24 24">
            <path d="M9 6h11M9 12h11M9 18h11"
                    fill="none" stroke="currentColor" stroke-width="1.75"
                    stroke-linecap="round" />
            <g fill="currentColor">
                <circle cx="4" cy="6" r="1.25" />
                <circle cx="4" cy="12" r="1.25" />
                <circle cx="4" cy="18" r="1.25" />
            </g>
        </symbol>
            
        <symbol id="checked-out-icon" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.75"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5" />
                <path d="m8.5 12 2.5 2.5 4.5-5" />
            </g>
        </symbol>


    </svg>
    

<header>
  <a class="site-logo" href="/">
    <svg width="32" height="32" aria-hidden="true">
      <use href="#plateko-icon"></use>
    </svg>
    <span>The Next Listen</span>
  </a>

    <nav>
        <ul>
            <li {% if active_page == 'home' %}class="active"{% endif %}>
                <a href="{{url_for('home')}}">Oppdag</a>
            </li>
            <li {% if active_page == 'mymusic' %}class="active"{% endif %}>
                <a href="{{url_for('mymusic')}}">Min musikk</a>
            </li>
            <li {% if active_page == 'feed' %}class="active"{% endif %}>
                <a href="{{url_for('feed')}}">Feed</a>
            </li>
            <li {% if active_page == 'login' %}class="active"{% endif %}>
                <a href="{{url_for('login')}}">
                    <svg class="user-icon" width="24" height="24">
                        <use href="#user-icon"></use>
                    </svg>
                </a>
            </li>
        </ul>
    </nav>  



</header>

<div id="message-container"></div>


 
<main> 


{% block content %}
{% endblock %}

</main>

</footer>
-->

</body>


</html>
