<html>

<head>
  <title> The Next Listen</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.cdnfonts.com/css/inter" rel="stylesheet">
</head>

<body>

<!--Icon definitions-->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="search-icon" viewBox="0 0 24 24">
            <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

<header> The Next Listen</header>

<nav>
    <ul>
        <li>Oppdag</li>
        <li>Min musikk</li>
        <li>Feed</li>
    </ul>
</nav>   

<main>
<section class="intro">
    <p>Hei og velkommen til The Next Listen! </p>

    <p>Oppdag nye album og bygg din egen musikk-backlog.<br>
    Lagre album du vil høre senere, hold oversikt over hva du lytter til, <br> og del anbefalinger med andre.</p>
</section>


<section class="search-section">  
    <div class="search-box">
        <label for="album-serach" class="sr-only">Søk etter album</label>
        <input  
            id="album-serch"
            class="search" 
            type="text" 
            placeholder="Søk etter album...">
        <svg class="search-icon" width="24" height="24">
            <use href="#search-icon"></use>
        </svg>
    </div>
</section>
</body>
</main>
